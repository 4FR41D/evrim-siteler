<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Takip Uygulaması</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Görev Takip</h1>
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Yeni görev ekle..." required>
            <button type="submit">Ekle</button>
        </form>
        <div id="empty-state" class="empty-state">
            <p>Henüz görev yok. Yeni bir görev ekleyerek başlayın!</p>
        </div>
        <ul id="todo-list"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
